name: 'Mirror'

on:
  workflow_dispatch:
  push:

jobs:
  mirror:
    name: 'Codeberg Mirror'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 'Mirror to Codeberg'
        uses: cssnr/mirror-repository-action@v1
        with:
          host: https://codeberg.org
          owner: Drazape
          repo: fish-subAbbr
          create: true
          username: Drazape
          password: ${{ secrets.CODEBERG_TOKEN }}
