name: Semantic Tag

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-workflows:
    name: Check Build and Docs Workflow Status
    runs-on: ubuntu-latest
    outputs:
      all_success: ${{ steps.check.outputs.all_success }}
    steps:
      - id: check
        uses: actions/github-script@v9
        with:
          script: |
            const { data: buildRuns } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-nixpkg.yaml',
              branch: 'main',
              status: 'completed',
              per_page: 1
            });

            const { data: docsRuns } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'docs.yaml',
              branch: 'main',
              status: 'completed',
              per_page: 1
            });

            let buildSuccess = true;
            if (buildRuns.workflow_runs.length > 0) {
              buildSuccess = buildRuns.workflow_runs[0].conclusion === 'success';
            }

            let docsSuccess = true;
            if (docsRuns.workflow_runs.length > 0) {
              docsSuccess = docsRuns.workflow_runs[0].conclusion === 'success';
            }

            const allSuccess = buildSuccess && docsSuccess;
            console.log(`Build success: ${buildSuccess}, Docs success: ${docsSuccess}, All success: ${allSuccess}`);
            core.setOutput('all_success', allSuccess.toString());

  semantic-release:
    name: Create Semantic Release Tag
    runs-on: ubuntu-latest
    needs: check-workflows
    if: needs.check-workflows.outputs.all_success == 'true'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "latest"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
