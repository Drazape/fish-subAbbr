name: GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build Nix Package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Determine version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Nix package
        run: |
          nix build .#default
          tar -czvf nixpkg.tar.gz -C result .

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: nixpkg
          path: nixpkg.tar.gz
          retention-days: 1
          archive: false

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check documentation workflow status
        id: check_docs
        uses: actions/github-script@v9
        with:
          script: |
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'docs.yaml',
              branch: 'main',
              status: 'completed',
              per_page: 1
            });

            if (runs.workflow_runs.length === 0) {
              console.log('No documentation workflow runs found, proceeding with release');
              core.setOutput('docs_success', 'true');
            } else {
              const lastRun = runs.workflow_runs[0];
              if (lastRun.conclusion === 'success') {
                console.log('Documentation workflow succeeded');
                core.setOutput('docs_success', 'true');
              } else {
                console.log(`Documentation workflow failed with conclusion: ${lastRun.conclusion}`);
                core.setOutput('docs_success', 'false');
              }
            }

      - name: Fail if documentation workflow did not succeed
        if: steps.check_docs.outputs.docs_success != 'true'
        run: |
          echo "Documentation workflow did not succeed. Aborting release."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: nixpkg
          path: ./

      - name: Get version
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          gh release create "$VERSION" \
            --title "Release $VERSION" \
            --generate-notes \
            --draft \
            nixpkg.tar.gz#nixpkg.tar.gz
